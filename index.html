<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Dussehra</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    margin:0;
    padding:0;
    overflow-x:hidden;
}

body{
    background:#fff;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================================================
   MAIN BANNER
========================================================= */

.dussehra-banner{
    position:relative;
    width:100%;
    height:200px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 70%,
            #214c57 0%,
            #123946 38%,
            #0a2938 72%,
            #061d2b 100%
        );
}


/* =========================================================
   OVERLAY
========================================================= */

.banner-overlay{
    position:absolute;
    inset:0;

    z-index:2;

    background:
        linear-gradient(
            180deg,
            rgba(0,15,25,.18),
            rgba(0,20,30,.04) 45%,
            rgba(0,10,20,.38)
        );

    pointer-events:none;
}


/* =========================================================
   CENTER LIGHT
========================================================= */

.light{
    position:absolute;

    left:50%;
    bottom:5px;

    width:180px;
    height:95px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(90,155,160,.22),
            transparent 72%
        );

    z-index:3;
}


/* =========================================================
   RAM
========================================================= */

.ram{
    position:absolute;

    left:0;
    bottom:-3px;

    width:43%;
    height:150px;

    z-index:6;
}

.ram img{
    display:block;

    width:100%;
    height:100%;
    padding-bottom:50px;

    object-fit:contain;
    object-position:center bottom;
}


/* =========================================================
   RAVANA
========================================================= */

.ravana{
    position:absolute;

    right:-1%;
    bottom:-2px;

    width:48%;
    height:157px;

    z-index:7;

    animation:
        ravanaBurn 3s ease-out infinite;
}

.ravana img{
    display:block;

    width:100%;
    height:100%;

    object-fit:contain;
    object-position:center bottom;
}


/* =========================================================
   ARROW
========================================================= */

.arrow{
    position:absolute;

    left:25%;
    top:140px;
    

    width:22px;
    height:2px;

    border-radius:5px;

    background:#fff1a0;

    z-index:15;

    opacity:0;

    /*
       IMPORTANT:
       Linear = arrow speed remains constant.
       No stopping in the middle.
    */

    animation:
        shootArrow 3s linear infinite;

    box-shadow:
        0 0 3px #fff,
        0 0 7px #ffd000,
        0 0 13px #ff7900;
}


/* =========================================================
   ARROW HEAD
========================================================= */

.arrow::after{
    content:"";

    position:absolute;

    right:-12px;
    top:-4px;

    width:0;
    height:0;

    border-left:13px solid #ffe45a;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;

    filter:
        drop-shadow(0 0 3px #ffae00);
}


/* =========================================================
   ARROW TRAIL
========================================================= */

.arrow::before{
    content:"";

    position:absolute;

    left:-30px;
    top:-3px;

    width:34px;
    height:7px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            #fff 0%,
            #ffe600 25%,
            #ff7600 55%,
            transparent 78%
        );

    filter:blur(1.5px);
}


/* =========================================================
   IMPACT FLASH
========================================================= */

.impact-flash{
    position:absolute;

    right:20%;
    bottom:69px;

    width:32px;
    height:32px;

    border-radius:50%;

    background:#fff;

    z-index:18;

    opacity:0;

    transform:scale(.1);

    animation:
        impactFlash 3s ease-out infinite;
}


/* =========================================================
   FIRE BURST
========================================================= */

.fire-burst{
    position:absolute;

    right:18%;
    bottom:59px;

    width:55px;
    height:55px;

    border-radius:50%;

    z-index:17;

    opacity:0;

    transform:scale(.1);

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #fff8a0 12%,
            #ffe600 27%,
            #ff9700 47%,
            #ff3500 65%,
            transparent 77%
        );

    filter:
        blur(1px)
        drop-shadow(0 0 10px #ff6500);

    animation:
        fireBurst 3s ease-out infinite;
}


/* =========================================================
   FLAMES
========================================================= */




/* =========================================================
   SPARKS
========================================================= */

.fire-sparks{
    position:absolute;

    right:14%;
    bottom:55px;

    width:80px;
    height:100px;

    z-index:20;

    opacity:0;

    animation:
        sparksAnimation 3s ease-out infinite;
}

.fire-sparks span{
    position:absolute;

    width:3px;
    height:5px;

    border-radius:50%;

    background:#ffe000;

    box-shadow:
        0 0 5px #ff6500,
        0 0 8px #ff3000;
}

.fire-sparks span:nth-child(1){
    left:45%;
    top:5%;
}

.fire-sparks span:nth-child(2){
    left:70%;
    top:20%;
}

.fire-sparks span:nth-child(3){
    left:25%;
    top:25%;
}

.fire-sparks span:nth-child(4){
    left:85%;
    top:45%;
}

.fire-sparks span:nth-child(5){
    left:10%;
    top:50%;
}

.fire-sparks span:nth-child(6){
    left:60%;
    top:65%;
}

.fire-sparks span:nth-child(7){
    left:35%;
    top:80%;
}

.fire-sparks span:nth-child(8){
    left:90%;
    top:75%;
}


/* =========================================================
   HAPPY DUSSEHRA
========================================================= */

.happy-text{
    position:absolute;

    top:0;
    left:50%;

    width:100%;

    text-align:center;

    color:#fff4bd;

    font-family:Georgia,serif;

    font-size:27px;
    font-weight:700;

    letter-spacing:.3px;

    text-shadow:
        0 0 5px #ffb300,
        0 0 12px #ff6700,
        0 2px 5px rgba(0,0,0,.8);

    opacity:0;

    z-index:30;

    pointer-events:none;

    animation:
        happyAnimation 3s cubic-bezier(.22,1,.36,1) infinite;
}


/* =========================================================
   BOTTOM FOG
========================================================= */

.bottom-fog{
    position:absolute;

    left:-5%;
    bottom:-22px;

    width:110%;
    height:55px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(31,76,84,.9),
            rgba(24,65,75,.65) 35%,
            transparent 72%
        );

    filter:blur(3px);

    z-index:22;

    pointer-events:none;
}


/* =========================================================
   =========================================================
   ARROW — STRAIGHT CONTINUOUS MOVEMENT
   =========================================================
========================================================= */

@keyframes shootArrow{

    /* RESET */
    0%{
        left:25%;
        bottom:82px;

        opacity:0;

        transform:translateX(0);
    }

    /* Arrow appears */
    4%{
        left:25%;
        bottom:82px;

        opacity:1;

        transform:translateX(0);
    }

    /*
       Continuous straight travel.
       SAME bottom value.
       LINEAR movement.
       No pause.
    */

    8%{
        left:29%;
        bottom:82px;

        opacity:1;
    }

    15%{
        left:35%;
        bottom:82px;

        opacity:1;
    }

    22%{
        left:41%;
        bottom:82px;

        opacity:1;
    }

    29%{
        left:47%;
        bottom:82px;

        opacity:1;
    }

    36%{
        left:53%;
        bottom:82px;

        opacity:1;
    }

    43%{
        left:59%;
        bottom:82px;

        opacity:1;
    }

    50%{
        left:65%;
        bottom:82px;

        opacity:1;
    }

    /*
       TARGET HIT
    */

    55%{
        left:69%;
        bottom:82px;

        opacity:1;
    }

    56%{
        left:69%;
        bottom:82px;

        opacity:0;
    }

    /* Stay hidden until next cycle */
    100%{
        left:69%;
        bottom:82px;

        opacity:0;
    }
}


/* =========================================================
   IMPACT
========================================================= */

@keyframes impactFlash{

    0%,
    54%{
        opacity:0;
        transform:scale(.1);
    }

    55%{
        opacity:1;
        transform:scale(.8);
    }

    57%{
        opacity:.9;
        transform:scale(1.5);
    }

    60%{
        opacity:.3;
        transform:scale(2.2);
    }

    64%{
        opacity:0;
        transform:scale(2.8);
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   FIRE BURST
========================================================= */

@keyframes fireBurst{

    0%,
    54%{
        opacity:0;
        transform:scale(.1);
    }

    55%{
        opacity:1;
        transform:scale(.7);
    }

    58%{
        opacity:1;
        transform:scale(1.5);
    }

    62%{
        opacity:.8;
        transform:scale(2.1);
    }

    67%{
        opacity:.25;
        transform:scale(2.8);
    }

    72%{
        opacity:0;
        transform:scale(3.2);
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   FLAMES
========================================================= */

@keyframes flameAnimation{

    0%,
    55%{
        opacity:0;

        transform:
            scale(.6,0);
    }

    57%{
        opacity:.8;

        transform:
            scale(.8,.55);
    }

    61%{
        opacity:1;

        transform:
            scale(1,1);
    }

    68%{
        opacity:.95;

        transform:
            scale(1.05,1.08);
    }

    74%{
        opacity:.7;

        transform:
            scale(1.1,1.2);
    }

    80%{
        opacity:.25;

        transform:
            scale(1.15,1.3);
    }

    84%{
        opacity:0;

        transform:
            scale(1.2,1.4);
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   SPARKS
========================================================= */

@keyframes sparksAnimation{

    0%,
    55%{
        opacity:0;

        transform:scale(.3);
    }

    57%{
        opacity:1;

        transform:scale(1);
    }

    67%{
        opacity:1;

        transform:scale(1.1);
    }

    79%{
        opacity:.3;

        transform:scale(1.5);
    }

    85%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   RAVANA BURN
========================================================= */

@keyframes ravanaBurn{

    /*
       Normal until arrow hits
    */

    0%,
    54%{
        opacity:1;

        filter:
            brightness(1)
            saturate(1)
            grayscale(0)
            blur(0);

        transform:
            scale(1)
            translateY(0);
    }


    /*
       Hit → brightness
    */

    56%{
        opacity:1;

        filter:
            brightness(1.7)
            saturate(1.8)
            sepia(.4);

        transform:
            scale(1.01)
            translateY(0);
    }


    /*
       Burning
    */

    62%{
        opacity:.95;

        filter:
            brightness(1.3)
            saturate(1.8)
            sepia(.6);

        transform:
            scale(1)
            translateY(3px);
    }


    70%{
        opacity:.75;

        filter:
            brightness(.8)
            saturate(1.2)
            grayscale(.35)
            blur(1px);

        transform:
            scale(.97)
            translateY(7px);
    }


    77%{
        opacity:.45;

        filter:
            brightness(.5)
            grayscale(.7)
            blur(2px);

        transform:
            scale(.91)
            translateY(15px);
    }


    83%{
        opacity:.15;

        filter:
            brightness(.25)
            grayscale(1)
            blur(4px);

        transform:
            scale(.82)
            translateY(27px);
    }


    /*
       Completely gone
    */

    87%{
        opacity:0;

        filter:
            brightness(0)
            grayscale(1)
            blur(7px);

        transform:
            scale(.72)
            translateY(38px);
    }


    /*
       Stay hidden until next cycle
    */

    100%{
        opacity:0;

        filter:
            brightness(0)
            grayscale(1)
            blur(7px);

        transform:
            scale(.72)
            translateY(38px);
    }
}


/* =========================================================
   HAPPY DUSSEHRA
   COMES ONLY AFTER RAVANA BURN
========================================================= */

@keyframes happyAnimation{

    /* CENTER nunchi start - hidden */
    0%{
        opacity:0;
        transform:
            translate(-50%,80px)
            scale(.85);
    }

    /* Ravana burn complete ayye varaku hidden */
    68%{
        opacity:0;
        transform:
            translate(-50%,80px)
            scale(.85);
    }

    /* Center lo appear */
    72%{
        opacity:1;
        transform:
            translate(-50%,70px)
            scale(.9);
    }

    /* Center nunchi TOP ki move */
    76%{
        opacity:1;
        transform:
            translate(-50%,35px)
            scale(1.03);
    }

    /* TOP position */
    80%{
        opacity:1;
        transform:
            translate(-50%,7px)
            scale(1);
    }

    /* TOP lo 2 sec stay */
    97%{
        opacity:1;
        transform:
            translate(-50%,7px)
            scale(1);
    }

    /* Next cycle kosam hide */
    100%{
        opacity:0;
        transform:
            translate(-50%,-30px)
            scale(.95);
    }
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:600px){

    .dussehra-banner{
        height:300px;
    }


    .ram{
        width:35%;
        height:230px;
    }


    .ravana{
        width:40%;
        height:240px;
    }


    .arrow{
        left:24%;
        bottom:135px;

        width:90px;
    }


    .impact-flash{
        right:18.5%;
        bottom:108px;
    }


    .fire-burst{
        right:18%;
        bottom:105px;

        width:65px;
        height:65px;
    }


    .flames{
        right:14%;
        width:150px;
        height:220px;
    }


    .fire-sparks{
        right:16%;
        bottom:105px;
    }


    .happy-text{
        top:0;

        font-size:40px;
    }
}
@media (max-width:599px){

    .arrow{
        position:absolute;

        left:25%;
        top:85px;

        width:22px;
        height:2px;

        border-radius:5px;

        background:#fff1a0;

        z-index:15;

        opacity:0;

        animation:
            shootArrow 3s linear infinite;

        box-shadow:
            0 0 3px #fff,
            0 0 7px #ffd000,
            0 0 13px #ff7900;
    }

}

</style>
</head>


<body>


<section class="dussehra-banner">


    <!-- OVERLAY -->
    <div class="banner-overlay"></div>


    <!-- LIGHT -->
    <div class="light"></div>


    <!-- RAM -->
    <div class="ram">
        <img
            src="ram.webp"
            alt="Lord Ram"
        >
    </div>


    <!-- ARROW -->
    <div class="arrow"></div>


    <!-- RAVANA -->
    <div class="ravana">
        <img
            src="ravana.webp"
            alt="Ravana"
        >
    </div>


    <!-- IMPACT FLASH -->
    <div class="impact-flash"></div>


    <!-- FIRE BURST -->
    <div class="fire-burst"></div>


    


    <!-- SPARKS -->
    <div class="fire-sparks">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- HAPPY DUSSEHRA -->
    <div class="happy-text">
        Happy Dussehra
    </div>


    <!-- FOG -->
    <div class="bottom-fog"></div>


</section>


</body>
</html>
